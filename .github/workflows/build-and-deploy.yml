name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL || secrets.COOLIFY_URL || secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "Webhook do Coolify não configurado. Deploy automático ignorado."
            exit 0
          fi

          CURL_ARGS=(-sS -o /tmp/coolify-response.txt -w "%{http_code}" -X POST "$COOLIFY_WEBHOOK_URL")
          if [ -n "$COOLIFY_TOKEN" ]; then
            CURL_ARGS+=(--header "Authorization: Bearer $COOLIFY_TOKEN")
          fi

          STATUS=$(curl "${CURL_ARGS[@]}" || true)
          echo "Status HTTP retornado: $STATUS"
          cat /tmp/coolify-response.txt

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Falha ao solicitar o deploy no Coolify."
            exit 1
          fi

          echo "Deploy solicitado com sucesso no Coolify."